# Registros de los contenedores: como máximo 3 archivos de 10 MB (sin esto, Docker los guarda sin límite)
x-registros: &registros
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- BACKEND (Django) ---
  backend:
      build: ./backend
      container_name: refugio_backend
      restart: always
      command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
      logging: *registros
      volumes:
        - media_volume:/app/media
        - ./backend/db.sqlite3:/app/db.sqlite3
        - static_volume:/app/staticfiles
      environment:
        - DJANGO_ALLOWED_HOSTS=${PROD_ALLOWED_HOSTS}
        - DJANGO_CSRF_TRUSTED_ORIGINS=${PROD_CSRF_TRUSTED_ORIGINS}
        - SECRET_KEY=${PROD_SECRET_KEY} # ¡Muy importante para seguridad criptográfica!
        - DEBUG=0 # En producción siempre 0 (Falso)
        - EMAIL_HOST_USER=${EMAIL_HOST_USER}
        - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
  # --- FRONTEND (Vue + Nginx) ---
  frontend:
    build: ./frontend
    container_name: refugio_frontend
    restart: always
    logging: *registros
    ports:
      - "8082:80" 
    depends_on:
      - backend
    volumes:
      - media_volume:/app/media # Nginx necesita ver las fotos para servirlas
      - static_volume:/app/staticfiles
volumes:
  media_volume:
  static_volume: